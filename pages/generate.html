<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Генератор серий</title>
  <link rel="stylesheet" href="../styles/generate_style.css">
</head>
<body>
  <div class="container">
    <h1>Генератор серий</h1>

    <div class="input-group">
      <label for="gun">Оружие</label>
      <input type="text" id="gun" placeholder="Например: GLOCK">
    </div>

    <div class="input-group">
      <label for="party">№ партии</label>
      <input type="number" id="party" placeholder="День и месяц">
    </div>

    <div class="input-group">
      <label for="series">Серия</label>
      <input type="number" id="series" placeholder="Год">
    </div>

    <div class="input-group">
      <label for="count">Количество товаров</label>
      <input type="number" id="count" placeholder="Например: 6">
    </div>

    <button onclick="generate()">Сгенерировать</button>

    <div class="result-box">
      <label for="result">Результат:</label>
      <textarea id="result" rows="8" readonly placeholder="Здесь появятся коды..."></textarea>
      <button class="copy-btn" onclick="copyText()">📋 Копировать</button>
    </div>
  </div>

  <script>
    function generate() {
      const gun = document.getElementById('gun').value.trim();
      const party = document.getElementById('party').value.trim();
      const series = document.getElementById('series').value.trim();
      const count = parseInt(document.getElementById('count').value);
      const resultField = document.getElementById('result');

      if (!gun || !party || !series || !count || count <= 0) {
        alert("Заполни все поля корректно!");
        return;
      }

      let results = [];
      for (let i = 0; i < count; i++) {
        let randomPart = Math.floor(1000 + Math.random() * 9000);
        results.push(`${gun}-${party}-${series}${randomPart}`);
      }

      resultField.value = results.join("\n");
    }

    function copyText() {
      const result = document.getElementById('result');
      if (result.value.trim() === "") return;
      result.select();
      document.execCommand("copy");
      alert("Результат скопирован!");
    }
  </script>
</body>
</html>
